<header
  class="fixed inset-x-0 top-0 z-50 bg-walnut-50/95 backdrop-blur transition-shadow duration-300"
  [class.shadow-md]="scrolled()"
>
  <div class="container-content flex h-20 items-center justify-between gap-4">
    <a routerLink="/" (click)="closeMenu()" class="relative shrink-0 h-8 w-[172px] overflow-hidden md:h-10 md:w-[215px]">
      <img
        [src]="logoUrl"
        [alt]="siteName"
        class="absolute left-0 top-0 h-[252px] w-[252px] max-w-none -translate-x-[12.43%] -translate-y-[43.7%] md:h-[315px] md:w-[315px]"
      />
    </a>

    <nav class="hidden lg:flex items-center gap-1">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-walnut-800 !text-walnut-50"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="rounded-full px-4 py-2 text-sm tracking-wide uppercase text-walnut-700 transition-colors duration-300 hover:bg-walnut-100"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="hidden lg:flex items-center gap-5">
      <a [href]="telUrl" class="flex items-center gap-2 text-sm font-medium text-walnut-800 hover:text-brass-500 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
          <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2Z" />
        </svg>
        Call Now
      </a>
      <a routerLink="/contact" class="btn-outline !px-6 !py-2.5">Request Quote</a>
    </div>

    <button
      type="button"
      class="lg:hidden flex h-10 w-10 items-center justify-center rounded-full text-walnut-900 hover:bg-walnut-100 transition-colors"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle menu"
    >
      @if (!menuOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-6 w-6">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-6 w-6">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      }
    </button>
  </div>

  @if (menuOpen()) {
    <nav class="lg:hidden border-t border-walnut-100 bg-walnut-50 px-6 py-6 shadow-xl flex flex-col gap-1">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          (click)="closeMenu()"
          routerLinkActive="bg-walnut-800 !text-walnut-50"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="rounded-full px-4 py-2.5 text-sm tracking-wide uppercase text-walnut-800"
        >
          {{ link.label }}
        </a>
      }
      <div class="mt-3 flex flex-col gap-3">
        <a [href]="telUrl" class="flex items-center justify-center gap-2 text-sm font-medium text-walnut-800">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
            <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2Z" />
          </svg>
          Call Now: {{ phone }}
        </a>
        <a routerLink="/contact" (click)="closeMenu()" class="btn-primary w-full">Request Quote</a>
      </div>
    </nav>
  }
</header>
